  <body>
    <!-- ===== NAV ===== -->
    <nav class="nav nav--solid">
      <ul class="nav-links nav-links--dark">
        <li><a href="../index.html">Pradžia</a></li>

    <!-- ===== PAGE HEADER ===== -->
    <!-- ===== MAP HEADER ===== -->
    <!-- Viršutinė žemėlapio puslapio dalis -->
    <!-- Kairėje rodoma grįžimo nuoroda, o pavadinimas centruojamas -->
    <header class="map-header">
      <a href="../index.html#maps" class="page-back">← Grįžti į žemėlapius</a>
      <h1>Kauno svarbios vietos</h1>
    </header>

    <!-- ===== MAP EMBED ===== -->
    <!-- Šioje vietoje per iframe įkeliamas interaktyvus žemėlapis -->
    <main class="map-page-embed">
      <!-- ===== LOADING TEXT ===== -->
<!-- Šis tekstas rodomas tol, kol iframe pilnai neužsikrauna -->
<p class="loading-text" id="loadingText">
  Žemėlapis kraunamas...
</p>

<!-- ===== MAP IFRAME ===== -->
<!-- onload funkcija paleidžiama tada, kai žemėlapis pilnai užkraunamas -->
<!-- Tada paslepiamas loading tekstas -->
<iframe
  src="https://gisdominykas.github.io/1_praktinis/map_1.html"
  title="Kauno svarbios vietos"
  onload="hideLoadingText()">
</iframe>

<!-- ===== JAVASCRIPT ===== -->
<!-- Funkcija paslepia tekstą po iframe užkrovimo -->
<script>
  function hideLoadingText() {

    /* Surandamas loading tekstas pagal id */
    const loadingText = document.getElementById("loadingText");

    /* Tekstas paslepiamas */
    loadingText.style.display = "none";
  }
</script>
    </main>
    </div>
  </body>
